<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5d5"><title>Selenika &amp; Samith — Wedding Invitation</title>
<style>
:root{--gold:#b99553;--paper:#f6f0e5;--ink:#70572f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eee6d8;color:var(--ink);font-family:Georgia,'Times New Roman',serif}
#opening{min-height:100svh;display:grid;place-items:center;padding:22px 12px;overflow:hidden;background:radial-gradient(ellipse at center,#fffaf0 0,#eee4d2 72%,#dfd0b8 100%)}
.scene{width:min(94vw,520px);height:min(88svh,790px);min-height:480px;position:relative;perspective:1600px;filter:drop-shadow(0 18px 24px #6f56352b)}
.cover{position:absolute;inset:0;overflow:hidden;border:1px solid #c6a66a;border-radius:4px;background:#f4ecdc;transform-style:preserve-3d}
.door{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;z-index:3;transform-style:preserve-3d;backface-visibility:hidden;transition:transform 1.8s cubic-bezier(.18,.72,.16,1);will-change:transform}
.door img{width:100%;height:100%;display:block;object-fit:cover}
.door.left{left:0;transform-origin:left center;border-right:1px solid #c4a46b}
.door.right{right:0;transform-origin:right center;border-left:1px solid #c4a46b}
.ribbon{position:absolute;z-index:5;left:0;top:50%;width:100%;height:auto;max-height:36%;object-fit:contain;transform:translateY(-50%);transition:transform .75s ease,opacity .65s ease;pointer-events:none}
.seal-hit{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(92px,25vw,132px);height:clamp(92px,25vw,132px);border:0;border-radius:50%;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seal-hit:focus-visible{outline:2px solid #a77e3c;outline-offset:5px}
.hint{position:absolute;z-index:9;left:0;right:0;bottom:18px;text-align:center;font-size:12px;letter-spacing:2px;color:#80643b;text-shadow:0 1px #fff8;pointer-events:none}
.scene.ribbon-away .ribbon{transform:translate(130%,-50%) rotate(8deg);opacity:0}
.scene.doors-open .door.left{transform:rotateY(-112deg)}.scene.doors-open .door.right{transform:rotateY(112deg)}
.scene.ribbon-away .seal-hit,.scene.ribbon-away .hint{opacity:0;pointer-events:none;transition:opacity .25s}
#invitation{display:none;min-height:100svh;padding:42px 18px 60px;position:relative;background:linear-gradient(#f8f3e9,#eee4d3)}
#invitation.visible{display:block;animation:fadein .9s ease both}@keyframes fadein{from{opacity:0}to{opacity:1}}
.invite-card{width:min(100%,650px);margin:auto;position:relative;min-height:760px;padding:60px 34px 48px;text-align:center;background:rgba(255,252,245,.86);border:1px solid #c5a56a;box-shadow:0 12px 36px #70572f18;overflow:hidden}
.invite-card:before{content:'';position:absolute;inset:9px;border:1px solid #d5bd8e;pointer-events:none}
.flower{position:absolute;width:clamp(105px,27%,190px);height:100%;top:0;object-fit:cover;opacity:.92;pointer-events:none}.flower.left{left:0;object-position:left center}.flower.right{right:0;object-position:right center}
.copy{position:relative;z-index:2;max-width:430px;margin:auto;text-shadow:0 1px #fff8}.eyebrow{font-size:12px;letter-spacing:3px;margin:10px 0 30px}.names{font-size:clamp(38px,9vw,64px);font-style:italic;line-height:1.12;color:#a17b3e;margin:22px 0}.amp{font-size:26px;margin:8px}.sub{font-size:13px;letter-spacing:2px;line-height:1.8;margin:25px 0}.date{display:flex;align-items:center;justify-content:center;gap:18px;margin:32px 0 8px;letter-spacing:2px}.date strong{font-size:54px;font-weight:400}.month{font-size:24px;font-style:italic;margin:0 0 30px}.detail{font-size:14px;letter-spacing:1.5px;line-height:1.9;margin:24px 0}.detail strong{font-size:17px;font-weight:normal}.rsvp{display:inline-block;margin-top:18px;padding:13px 26px;border:1px solid #b99553;color:#765b31;text-decoration:none;letter-spacing:2px;background:#fffaf1}
@media(max-width:420px){.scene{min-height:490px;height:82svh}.invite-card{padding:48px 18px 38px;min-height:720px}.copy{max-width:330px}.eyebrow{font-size:10px}.sub,.detail{font-size:12px}}

</style>
</head>
<body>
<section id="opening" aria-label="Wedding invitation envelope">
 <div class="scene" id="scene">
  <div class="cover">
   <div class="door left"><img src="assets/left-door.jpg" alt="Left side of the invitation envelope"></div>
   <div class="door right"><img src="assets/right-door.jpg" alt="Right side of the invitation envelope"></div>
   <img class="ribbon" id="ribbon" src="assets/gold-ribbon-seal.png" alt="Gold ribbon and wax seal">
   <button class="seal-hit" id="openSeal" aria-label="Open wedding invitation"></button>
   <div class="hint">TOUCH THE SEAL TO OPEN</div>
  </div>
 </div>
</section>
<section id="invitation" aria-label="Wedding invitation details">
 <div class="invite-card">
  <img class="flower left" src="assets/floral-left.jpg" alt="Ivory floral decoration">
  <img class="flower right" src="assets/floral-right.jpg" alt="Ivory floral decoration">
  <div class="copy">
   <div class="eyebrow">TOGETHER WITH THEIR FAMILIES</div>
   <div class="names">Selenika<br><span class="amp">&amp;</span><br>Samith</div>
   <div class="sub">JOYFULLY INVITE YOU TO<br>CELEBRATE THEIR WEDDING</div>
   <div class="date"><span>FRIDAY</span><strong>18</strong><span>2026</span></div>
   <div class="month">th December</div>
   <div class="detail"><strong>PORUWA CEREMONY</strong><br>10:00 AM</div>
   <div class="detail"><strong>THE RIVER EDGE HOTEL</strong><br>KADUWELA, SRI LANKA</div>
   <a class="rsvp" href="https://wa.me/94750778182?text=We%20are%20happy%20to%20confirm%20our%20attendance%20at%20your%20wedding." target="_blank" rel="noopener">RSVP ON WHATSAPP</a>
  </div>
 </div>
</section>
<script>
(function(){
 const scene=document.getElementById('scene');
 const button=document.getElementById('openSeal');
 const opening=document.getElementById('opening');
 const invitation=document.getElementById('invitation');
 let opened=false;
 button.addEventListener('click',function(event){
  event.preventDefault();
  event.stopPropagation();
  if(opened)return;
  opened=true;
  button.disabled=true;
  // Stage 1: slide the ribbon and seal away.
  scene.classList.add('ribbon-away');
  // Stage 2: only after the ribbon has cleared, swing both gatefold doors outward.
  window.setTimeout(function(){
    scene.classList.add('doors-open');
    // Wait for the door animation to finish before revealing the invitation page.
    window.setTimeout(function(){
      opening.style.display='none';
      invitation.classList.add('visible');
      window.scrollTo({top:0,behavior:'instant'});
    },1900);
  },800);
 });
})();
</script>
</body></html>
